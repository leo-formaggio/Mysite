{% extends "base.html" %}
{% block content %}
<div class="container text-center">
    <h1 class="mt-4 m-3">
        Lista de Estudantes
    </h1>
    <nav class="container text-center">
            <ul class="list-unstyled m-5">
                <button><li><a href="{% url 'add_estudante' %}" class="text-decoration-none">Adicionar Estudante</a></li></button>
                <form action="{% url 'buscar_estudante' %}" method="get" style="display:inline">
                    <input type="text" name="q" placeholder="Buscar Estudante...">
                    <button type="submit">
                        Buscar
                    </button>
                </form>
            </ul>
        </nav>
    <ul class="list-unstyled">
        {% for estudante in estudantes %}
            <li class="mt-3">
                {{ estudante.nome }} {{ estudante.sobrenome }}
                <a href="{% url 'estudante_edit' estudante.pk %}" 
                   class="btn btn-warning btn-sm ms-2">
                    Editar
                </a>
                <a href="{% url 'estudante_delete' estudante.pk %}" 
                   class="btn btn-danger btn-sm ms-2">
                    Deletar
                </a>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
