{% extends 'base.html' %}

{% block content %}
<div class="mt-4 text-center">
    <h2>Excluir estudante</h2>

    <p>
        Tem certeza que deseja excluir o estudante
        <strong>{{ estudante.nome }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-success">
            Confirmar
        </button>
        <a href="{% url 'lista_estudantes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
