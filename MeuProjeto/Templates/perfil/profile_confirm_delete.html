{% extends "base.html" %}
{% block content %}

<div class="m-4 text-center">
    <h2>Excluir perfil</h2>
    <p>
        Tem certeza que deseja excluir 
        <strong>{{ user.username }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">
            Confirmar
        </button>
        <a href="{% url 'profile' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
