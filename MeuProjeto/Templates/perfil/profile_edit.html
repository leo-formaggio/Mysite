{% extends "base.html" %}
{% block content %}

<div class="m-4 text-center">
    <h1>Editar Perfil</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ user_form.as_p }}

        <h4>Avatar</h4>
            {{ profile_form.as_p }}

        {% if user.is_authenticated %}
        <button type="submit" class="btn btn-success">
            Salvar
        </button>
        {% endif %}
        <a href="{% url 'profile' %}" class="btn btn-secondary">Cancelar</a>
    </form>

</div>

{% endblock %}
