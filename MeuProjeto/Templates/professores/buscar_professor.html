{% extends "base.html" %}
{% block content %}
<div class="container text-center">
    <h2>
        Buscar Nome
    </h2>
    <p>
        Pesquisa por: "{{ termo }}"
    </p>
    <ul class="list-unstyled">
        {% for p in professores %}
            <li>
               Nome: {{ p.nome }} {{ p.sobrenome }} - {{ p.email }}
            </li>
        {% empty %}
            <li>
                Não encontrado.
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'lista_professor' %}" class="btn btn-secondary">Voltar</a>
</div>
{% endblock %}
