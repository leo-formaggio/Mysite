{% extends "base.html" %}
{% block content %}
<div class="container text-center">
    <h1 class="mt-4 m-3">
        Lista de Professores
    </h1>
    <nav class="container text-center">
            <ul class="list-unstyled m-5">
                <!-- <button><li><a href="{% url 'add_estudante' %}" class="text-decoration-none">Adicionar Estudante</a></li></button> -->
                <button><li><a href="{% url 'add_professor' %}" class="text-decoration-none">Adicionar Professor</a></li></button>
                <!-- <button><li><a href="{% url 'add_curso' %}" class="text-decoration-none">Adicionar Curso</a></li></button> -->
                <form action="{% url 'buscar_professor' %}" method="get" style="display:inline">
                    <input type="text" name="q" placeholder="Buscar Professor...">
                    <button type="submit">
                        Buscar
                    </button>
                </form>
            </ul>
        </nav>
    <ul class="list-unstyled">
        {% for professor in professor %}
            <li class="mt-3">
                {{ professor.nome }} {{ professor.sobrenome }}
                <a href="{% url 'professor_edit' professor.pk %}" 
                   class="btn btn-warning btn-sm ms-2">
                    Editar
                </a>
                <a href="{% url 'professor_delete' professor.pk %}" 
                   class="btn btn-danger btn-sm ms-2">
                    Deletar
                </a>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
