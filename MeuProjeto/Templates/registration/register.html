{% extends "base.html" %}
{% block content %}

<div class="m-4 text-center">
    <h2>Registrar</h2>

    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">
            Criar conta
        </button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
