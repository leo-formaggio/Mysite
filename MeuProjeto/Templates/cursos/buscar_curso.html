{% extends "base.html" %}
{% block content %}
<div class="container text-center">
    <h2>
        Buscar Nome
    </h2>
    <p>
        Pesquisa por: "{{ termo }}"
    </p>
    <ul class="list-unstyled">
        {% for c in cursos %}
            <li>
               Nome: {{ c.nome }} - {{ c.turma }}
            </li>
        {% empty %}
            <li>
                Não encontrado.
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'lista_curso' %}" class="btn btn-secondary">Voltar</a>
</div>
{% endblock %}
