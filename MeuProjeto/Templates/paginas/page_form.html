{% extends "base.html" %}
{% block content %}

<div class="m-4 text-center">
    <h2>Nova Página</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">
            Salvar
        </button>
        <a href="{% url 'pages' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
