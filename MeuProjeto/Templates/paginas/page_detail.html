{% extends "base.html" %}
{% block content %}

<div class="m-4 text-center">
    <h1 class="mt-4">{{ pagina.titulo }}</h1>
    <p>{{ pagina.conteudo }}</p>
    <p><small>
        Por 
        <strong>{{ pagina.autor }}</strong> 
        em {{ pagina.criado_em }}
    </small></p>

    <a href="{% url 'pages' %}" class="btn btn-secondary">
        Voltar
    </a>
</div>

{% endblock %}
